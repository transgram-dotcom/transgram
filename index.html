<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05060a" />
  <title>Reels</title>
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient"></div>

  <main class="stage" id="stage">
    <header class="topbar"><span class="brand">Transgram</span></header>
    <div class="feed" id="feed"></div>

    <div class="swipe-hint" id="swipeHint" aria-hidden="true">
      <div class="swipe-hint-inner">
        <svg viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"/></svg>
        <svg viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"/></svg>
      </div>
    </div>
  </main>

  <nav class="desk-nav">
    <button id="prevBtn" aria-label="Previous reel">
      <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
    <button id="nextBtn" aria-label="Next reel">
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <div class="reel-info">
        <div class="profile-row">
          <a class="profile" href="${esc(p.link)}" target="_blank" rel="noopener noreferrer">
            <span class="avatar-ring"><img src="${esc(p.avatar)}" alt="${esc(p.name)}" loading="lazy"></span>
            <span class="name">${esc(p.name)}</span>
            ${p.verified ? ICONS.verified : ''}
          </a>
          ${p.buttonLink ? `<a class="profile-cta" href="${esc(p.buttonLink)}" target="_blank" rel="noopener noreferrer">${esc(p.buttonText || 'Visit')}</a>` : ''}
        </div>
        ${reel.caption ? `<p class="caption">${esc(reel.caption)}</p>` : ''}
      </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
